<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#8c52ff",
                        "background-light": "#f8f6f6",
                        "background-dark": "#0f0a08",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<title>Admin Login - Juego de Equipo</title>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center overflow-x-hidden p-4">
<!-- Background Decor -->
<div class="absolute inset-0 z-0 overflow-hidden">
<div class="absolute -top-[10%] -left-[10%] h-[40%] w-[40%] rounded-full bg-primary/10 blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[10%] h-[40%] w-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
</div>
<!-- Login Card Container -->
<div class="z-10 w-full max-w-md">
<div class="flex flex-col items-center mb-8">
<div class="mb-6 h-16 w-16 overflow-hidden rounded-xl">
<img alt="Juego de Equipo official logo" class="h-full w-full object-contain" data-alt="Juego de Equipo purple geometric brand logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDQFNoGCCOKamjXbO4s5Uf-JyjA9FCyGnObg3pS74p3dtAKLBceXb_saTa2YC4f2AJEnrOjC4GP0ASX8YgErrwHLhIgU63DLbIG3o85JRIQunHypcQC6WkTexcWa_aBqWURYe7eS_KJveya6QZ5iMxEI6wN7i7oVLri1MsymsaE6QeTQEd2pwlbRbd9ft9tGHq9AzVfXvUb-PKqNkt4D6T8vr2kyha8yISUHY86P5i9TguKEMRwXL8I5zRuU3HGgnBq4790mIf9FX4"/>
</div>
<h1 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white">Welcome back</h1>
<p class="mt-2 text-sm text-slate-600 dark:text-slate-400">Stream management &amp; administration portal</p>
</div>
<div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-xl dark:border-slate-800 dark:bg-slate-900/50 backdrop-blur-sm">
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium leading-none text-slate-700 dark:text-slate-300" for="email">
                        Admin Email
                    </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-slate-400 dark:text-slate-500">
                            mail
                        </span>
<input class="flex h-12 w-full rounded-xl border border-slate-200 bg-slate-50 px-10 py-2 text-sm ring-offset-white placeholder:text-slate-500 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 dark:border-slate-700 dark:bg-slate-800/50 dark:text-slate-100 dark:ring-offset-slate-950 dark:placeholder:text-slate-500" id="email" name="email" placeholder="admin@juegodeequipo.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex items-center justify-between">
<label class="text-sm font-medium leading-none text-slate-700 dark:text-slate-300" for="password">
                            Password
                        </label>
<a class="text-xs font-medium text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-slate-400 dark:text-slate-500">
                            lock
                        </span>
<input class="flex h-12 w-full rounded-xl border border-slate-200 bg-slate-50 px-10 py-2 text-sm ring-offset-white placeholder:text-slate-500 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 dark:border-slate-700 dark:bg-slate-800/50 dark:text-slate-100 dark:ring-offset-slate-950 dark:placeholder:text-slate-500" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 flex items-center text-slate-400 hover:text-slate-600 dark:text-slate-500 dark:hover:text-slate-300" type="button">
<span class="material-symbols-outlined text-[20px]">
                                visibility
                            </span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center space-x-2">
<input class="h-4 w-4 rounded border-slate-300 text-primary focus:ring-primary dark:border-slate-700 dark:bg-slate-800" id="remember" type="checkbox"/>
<label class="text-sm font-medium text-slate-600 dark:text-slate-400" for="remember">
                        Stay signed in for 30 days
                    </label>
</div>
<!-- Submit Button -->
<button class="flex h-12 w-full items-center justify-center rounded-xl bg-primary px-4 py-2 text-sm font-bold text-white shadow-lg shadow-primary/20 transition-all hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 active:scale-[0.98]" type="submit">
                    Secure Login
                </button>
</form>
</div>
<!-- Footer Links -->
<div class="mt-8 flex justify-center gap-6 text-xs font-medium text-slate-500 dark:text-slate-500">
<a class="hover:text-primary transition-colors" href="#">Security Policy</a>
<a class="hover:text-primary transition-colors" href="#">Help Center</a>
<a class="hover:text-primary transition-colors" href="#">Platform Status</a>
</div>
</div>
</div>

<script>
document.querySelector("form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch("http://localhost:3000/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });

  const result = await res.json();

  if (result.success) {
    alert("✅ Bienvenido, acceso correcto");
    // Podés redirigir a un panel admin:
    // window.location.href = "/admin.html";
  } else {
    alert("❌ Credenciales inválidas");
  }
});
</script>
<script>
document.querySelector("form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch("http://localhost:3000/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });

  const result = await res.json();

  if (result.success) {
    // ✅ Login correcto → redirigir
    window.location.href = "/back-carga-fixture.html";
  } else {
    alert("❌ Credenciales inválidas");
  }
});
</script>

</body></html>
