<script>
// ── Formation position maps [x%, y%] — 11 positions including GK ──
const FORMATIONS = {
  "4-4-2":   [[8,50],[20,15],[20,38],[20,62],[20,85],[32,15],[32,38],[32,62],[32,85],[43,35],[43,65]],
  "4-3-3":   [[8,50],[20,15],[20,38],[20,62],[20,85],[31,25],[31,50],[31,75],[42,20],[42,50],[42,80]],
  "4-2-3-1": [[8,50],[19,15],[19,38],[19,62],[19,85],[27,35],[27,65],[35,20],[35,50],[35,80],[43,50]],
  "4-3-1-2": [[8,50],[19,15],[19,38],[19,62],[19,85],[28,25],[28,50],[28,75],[36,50],[43,35],[43,65]],
  "4-1-4-1": [[8,50],[19,15],[19,38],[19,62],[19,85],[26,50],[34,15],[34,38],[34,62],[34,85],[43,50]],
  "4-1-3-2": [[8,50],[19,15],[19,38],[19,62],[19,85],[27,50],[34,25],[34,50],[34,75],[43,35],[43,65]],
  "4-4-1-1": [[8,50],[19,15],[19,38],[19,62],[19,85],[29,15],[29,38],[29,62],[29,85],[37,50],[43,50]],
  "4-5-1":   [[8,50],[19,15],[19,38],[19,62],[19,85],[31,10],[31,30],[31,50],[31,70],[31,90],[43,50]],
  "3-5-2":   [[8,50],[19,25],[19,50],[19,75],[30,10],[30,30],[30,50],[30,70],[30,90],[42,35],[42,65]],
  "3-4-3":   [[8,50],[19,25],[19,50],[19,75],[30,15],[30,38],[30,62],[30,85],[42,20],[42,50],[42,80]],
  "3-4-1-2": [[8,50],[19,25],[19,50],[19,75],[28,15],[28,38],[28,62],[28,85],[37,50],[43,35],[43,65]],
  "5-3-2":   [[8,50],[19,10],[19,30],[19,50],[19,70],[19,90],[32,25],[32,50],[32,75],[42,35],[42,65]],
  "5-4-1":   [[8,50],[19,10],[19,30],[19,50],[19,70],[19,90],[32,15],[32,38],[32,62],[32,85],[43,50]],
  "5-2-3":   [[8,50],[19,10],[19,30],[19,50],[19,70],[19,90],[30,35],[30,65],[42,20],[42,50],[42,80]]
};

function renderPitch(team, containerId, side) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const positions = FORMATIONS[team.formacion] || FORMATIONS["4-3-3"];
  const color = team.color || (side === 'home' ? '#019604' : '#FFFFFF');
  const numColor = team.colorNumero || '#ffffff';
  const jugadores = team.jugadores || [];

  container.innerHTML = positions.map((pos, i) => {
    const num = jugadores[i]?.numero || (i + 1);
    const isGK = i === 0;
    const size = isGK ? 'w-10 h-10 border-[3px] font-black shadow-xl' : 'w-9 h-9 border-2 font-bold';
    const posStyle = side === 'home'
      ? `left:${pos[0]}%;top:${pos[1]}%`
      : `right:${pos[0]}%;top:${pos[1]}%`;
    return `<div class="absolute -translate-y-1/2 ${size} rounded-full flex items-center justify-center text-sm" style="${posStyle};background:${color};color:${numColor};border-color:${numColor}">${num}</div>`;
  }).join('');
}

window.onOverlayState = function(state) {
  // ── Scoreboard ──
  const el = (id) => document.getElementById(id);
  el('sb-local-logo').src = state.local.logo || '';
  el('sb-local-name').textContent = state.local.nombre || '';
  el('sb-local-score').textContent = state.local.goles ?? 0;
  el('sb-away-logo').src = state.visitante.logo || '';
  el('sb-away-name').textContent = state.visitante.nombre || '';
  el('sb-away-score').textContent = state.visitante.goles ?? 0;
  el('sb-status').textContent = state.match.status === 'NO INICIADO' ? '' : 'EN VIVO • ' + state.match.status;

  // ── Árbitro / Estadio ──
  el('info-referee').textContent = state.match.referee || '';
  el('info-stadium').textContent = state.match.stadium || '';

  // ── Colores de equipo ──
  el('home-color-bar').style.background = state.local.color || '#019604';
  el('away-color-bar').style.background = state.visitante.color || '#FFFFFF';

  // ── Pitch (formación dinámica) ──
  renderPitch(state.local, 'pitch-home', 'home');
  renderPitch(state.visitante, 'pitch-away', 'away');

  // ── Rosters ──
  renderRoster(state.local, 'home-roster', 'home-team');
  renderRoster(state.visitante, 'away-roster', 'away-team');

  // ── Resultados simultáneos ──
  const grid = el('results-grid');
  grid.innerHTML = '';
  (state.resultados || []).forEach(r => {
    grid.innerHTML += `
      <div class="bg-black/40 px-3 py-2 rounded-xl border border-white/5 flex items-center gap-2 text-[13px] font-bold min-w-0">
        <span class="flex flex-1 min-w-0 items-center gap-1 overflow-hidden">${r.logoLocal ? `<img src="${r.logoLocal}" style="height:18px;flex-shrink:0">` : ''}<span class="truncate block">${r.local}</span></span>
        <span class="text-brandPurple bg-brandPurple/10 px-2 py-0.5 rounded font-black shrink-0">${r.gl}-${r.gv}</span>
        <span class="flex flex-1 min-w-0 items-center gap-1 justify-end overflow-hidden"><span class="truncate block text-right">${r.visitante}</span>${r.logoVisitante ? `<img src="${r.logoVisitante}" style="height:18px;flex-shrink:0">` : ''}</span>
      </div>`;
  });
  if (state.libre) {
    grid.innerHTML += `
      <div class="bg-black/20 px-3 py-2 rounded-xl border border-white/5 flex justify-center items-center text-[13px] font-bold col-span-2">
        <span class="truncate text-white/70">LIBRE: ${state.libre}</span>
      </div>`;
  }
};

function renderRoster(team, rosterId, titleId) {
  const container = document.getElementById(rosterId);
  const title = document.getElementById(titleId);
  if (!container || !title) return;
  title.textContent = team.nombre || '';
  container.innerHTML = '';
  function crearJugador(j, numero, suplente) {
    const row = document.createElement('div');
    row.className = `flex justify-between items-center py-1 border-b border-white/5 ${suplente ? 'opacity-50 italic' : ''}`;
    const nombre = document.createElement('span');
    const subIcon = j.entro ? ' \u25b2' : (j.sustituido ? ' \u25bc' : '');
    const subColor = j.entro ? 'color:#22c55e' : (j.sustituido ? 'color:#ef4444' : '');
    nombre.innerHTML = (j.numero || numero) + '. ' + (j.nombre || '').replace(/</g,'&lt;') + (subIcon ? ` <span style="font-size:0.7em;${subColor}">${subIcon}</span>` : '');
    const stats = document.createElement('div');
    stats.className = 'flex items-center gap-1';
    if (j.goles) stats.innerHTML += '⚽'.repeat(j.goles);
    if (j.amarilla) stats.innerHTML += '<div class="w-3 h-4 bg-yellow-400 rounded-sm shadow-sm"></div>';
    if (j.roja) stats.innerHTML += '<div class="w-3 h-4 bg-red-600 rounded-sm shadow-sm"></div>';
    row.appendChild(nombre);
    row.appendChild(stats);
    return row;
  }
  (team.jugadores || []).forEach((j, i) => container.appendChild(crearJugador(j, i + 1, false)));
  (team.suplentes || []).forEach((j, i) => container.appendChild(crearJugador(j, i + (team.jugadores?.length || 0) + 1, true)));
}
</script>
