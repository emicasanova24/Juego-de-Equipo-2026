<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Formaciones</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  font-family: 'Segoe UI', sans-serif;
  color: #fff;
}

body {
  width: 1080px;
  height: 1920px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: 120px;
}

/* CONTENEDOR GENERAL */
.container {
  width: 1020px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
}

/* EQUIPO */
.equipo {
  background: rgba(0,0,0,0.55);
  border-radius: 18px;
  padding: 28px;
}

/* NOMBRE EQUIPO */
.equipo h2 {
  margin: 0 0 20px;
  font-size: 36px;
  font-weight: 900;
  text-align: center;
  letter-spacing: 1px;
}

/* JUGADOR */
.jugador {
  display: grid;
  grid-template-columns: 36px 1fr auto;
  align-items: center;
  padding: 8px 0;
  font-size: 30px;
}

/* NUMERO */
.numero {
  font-weight: 700;
  opacity: 0.5;
}

/* NOMBRE */
.nombre {
  font-weight: 600;
  margin-left: 15px;
}

/* STATS */
.stats {
  display: flex;
  align-items: center;
  gap: 6px;
}

.stats img {
  width: 22px;
  height: 22px;
}

/* SUPLENTES */
.suplentes-title {
  margin-top: 28px;
  font-size: 22px;
  font-weight: 700;
  opacity: 0.75;
  letter-spacing: 1px;
}
</style>
</head>

<body>

<div class="container" id="formaciones"></div>

<script src="./js/overlay-client.js"></script>
<script>
const container = document.getElementById("formaciones");

function renderJugador(jugador, numero, colorNumero) {
  const div = document.createElement("div");
  div.className = "jugador";
  const numeroMostrado = jugador.numero || numero;
  const subIcon = jugador.entro ? ' <span style="color:#22c55e;font-size:0.75em">▲</span>' : (jugador.sustituido ? ' <span style="color:#ef4444;font-size:0.75em">▼</span>' : '');
  const numStyle = colorNumero ? ` style="color:${colorNumero};opacity:1"` : '';
  div.innerHTML = `
    <span class="numero"${numStyle}>${numeroMostrado}</span>
    <span class="nombre">${jugador.nombre}${subIcon}</span>
    <span class="stats">
      ${"⚽".repeat(jugador.goles || 0)}
      ${jugador.amarilla ? '<img src="./assets/amarilla.png">' : ""}
      ${jugador.roja ? '<img src="./assets/roja.png">' : ""}
    </span>
  `;
  return div;
}

function renderFormaciones(state) {
  container.innerHTML = "";
  ["local", "visitante"].forEach(side => {
    const eq = state[side];
    if (!eq || !eq.nombre) return;

    const box = document.createElement("div");
    box.className = "equipo";
    box.innerHTML = `<h2>${eq.nombre}</h2>`;

    (eq.jugadores || []).forEach((j, i) =>
      box.appendChild(renderJugador(j, i + 1, eq.colorNumero))
    );

    box.innerHTML += `<div class="suplentes-title">SUPLENTES</div>`;

    (eq.suplentes || []).forEach((j, i) =>
      box.appendChild(renderJugador(j, i + (eq.jugadores || []).length + 1, eq.colorNumero))
    );

    container.appendChild(box);
  });
}

window.onOverlayState = renderFormaciones;
</script>

</body>
</html>
