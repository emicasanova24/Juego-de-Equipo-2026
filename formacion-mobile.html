const container = document.getElementById("formaciones");

function renderJugador(jugador, numero) {
  const li = document.createElement("li");
  li.innerHTML = `
    <span class="numero">${numero}.</span>
    <span class="nombre">${jugador.nombre}</span>
    <span class="stats">
      ${"".padStart(jugador.goles, "⚽")}
      ${jugador.amarilla ? '<img src="./assets/amarilla.png" alt="amarilla">' : ""}
      ${jugador.roja ? '<img src="./assets/roja.png" alt="roja">' : ""}
    </span>
  `;
  return li;
}

function renderFormaciones() {
  container.innerHTML = "";
  Object.values(formaciones).forEach(eq => {
    const box = document.createElement("div");
    box.className = "equipo";

    box.innerHTML = `<h2>${eq.nombre}</h2><h3>Titulares</h3>`;
    const olJugadores = document.createElement("ol");
    eq.jugadores.forEach((j, i) => olJugadores.appendChild(renderJugador(j, i+1)));
    box.appendChild(olJugadores);

    box.innerHTML += "<h3>Suplentes</h3>";
    const olSuplentes = document.createElement("ol");
    olSuplentes.start = eq.jugadores.length + 1;
    eq.suplentes.forEach((j, i) => olSuplentes.appendChild(renderJugador(j, i + eq.jugadores.length + 1)));
    box.appendChild(olSuplentes);

    container.appendChild(box);
  });
}

renderFormaciones();

// Ejemplo de actualización de estadísticas
function agregarGol(jugador) {
  jugador.goles++;

}

function ponerAmarilla(jugador) {

function ponerRoja(jugador) {
