<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0"/>
<title>Streaming Fútbol Pro - Vertical</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>

<script>
tailwind.config = {
darkMode: "class",
theme: {
extend: {
colors: {
primary: "#7c3aed",
"neon-blue": "#00f0ff",
"neon-pink": "#ff00e5",
"background-light": "#1a1a2e",
"background-dark": "#050508",
},
fontFamily: {
display: ["Oswald", "sans-serif"],
sans: ["Inter", "sans-serif"],
},
borderRadius: {
DEFAULT: "8px",
},
},
},
};
</script>

<style>

html, body {
width:1080px;
height:1920px;
margin:0;
padding:0;
overflow:hidden;
background:#050508;
}

.neon-border {
box-shadow: 0 0 10px rgba(0,240,255,0.3);
}

.gradient-purple {
background: linear-gradient(180deg, rgba(124,58,237,0.2) 0%, rgba(5,5,8,1) 100%);
}

.sponsor-grid img {
filter: brightness(0) invert(1);
opacity:0.8;
max-height:50px;
object-fit:contain;
}

.skew-x {
transform:skewX(-15deg);
}

</style>

</head>

<body class="flex items-center justify-center bg-black">

<div class="w-[1080px] h-[1920px] flex flex-col relative overflow-hidden bg-background-dark font-sans text-white">

<!-- HEADER -->

<header class="p-8 flex justify-between items-center bg-[#0d0d16] border-b border-primary/20">

<div class="flex items-center gap-4">

<img src="assets/logo.png" alt="Juego de Equipo" class="w-[11.5rem] h-[3.5rem] object-contain">

</div>

<div class="bg-white px-6 py-2 skew-x">
<p class="text-black font-display font-black text-xl italic tracking-wide">STREAM EN VIVO</p>
</div>

</header>


<!-- SCOREBOARD -->

<section class="p-10 gradient-purple flex flex-col items-center">

<div class="flex items-center justify-between w-full mb-10">

<div class="flex items-center gap-3">
<span class="material-icons text-neon-blue text-2xl">mic</span>
<span class="font-display text-xl tracking-widest text-gray-300">RADIOFÓNICA 104.7</span>
</div>

<div class="bg-primary/20 border border-primary/40 px-6 py-2 rounded-full">
<p id="mb-status" class="text-sm text-neon-blue font-bold tracking-widest uppercase">
</p>
</div>

</div>

<div class="w-full bg-black/40 backdrop-blur-md rounded-3xl p-14 border border-white/10 flex flex-col items-center shadow-2xl">

<div class="grid grid-cols-3 w-full items-center">

<!-- TEAM 1 -->

<div class="flex flex-col items-center text-center">

<div class="w-36 h-36 bg-white rounded-full flex items-center justify-center border-4 border-white shadow-lg mb-4 overflow-hidden">
<img id="mb-local-logo" src="" class="w-full h-full object-contain"/>
</div>

<h2 id="mb-local-name" class="font-display font-bold text-2xl uppercase">
</h2>

</div>


<!-- SCORE -->

<div class="flex flex-col items-center">

<div class="text-xl font-display text-gray-400 mb-2 opacity-0">
00:00
</div>

<div class="flex items-center gap-6">

<span id="mb-local-score" class="text-8xl font-display font-black text-primary italic">0</span>
<span class="text-4xl font-display text-gray-600">-</span>
<span id="mb-away-score" class="text-8xl font-display font-black text-primary italic">0</span>

</div>

</div>


<!-- TEAM 2 -->

<div class="flex flex-col items-center text-center">

<div class="w-36 h-36 bg-white rounded-full flex items-center justify-center border-4 border-white shadow-lg mb-4 overflow-hidden">
<img id="mb-away-logo" src="" class="w-full h-full object-contain"/>
</div>

<h2 id="mb-away-name" class="font-display font-bold text-2xl uppercase">
</h2>

</div>

</div>

</div>

</section>





<!-- FOOTER -->

<footer class="mt-auto bg-black py-6 px-10 flex justify-between items-center border-t border-white/5">

<div class="flex flex-col">

<span class="text-xs text-gray-500 uppercase tracking-widest">
Powered by
</span>

<span class="text-lg font-display font-black italic text-primary">
Juego de Equipo
</span>

</div>

<div class="flex gap-3">

<div class="w-3 h-3 rounded-full bg-neon-pink animate-pulse"></div>
<div class="w-3 h-3 rounded-full bg-primary animate-pulse"></div>
<div class="w-3 h-3 rounded-full bg-neon-blue animate-pulse"></div>

</div>

</footer>

</div>

<script src="./js/overlay-client.js"></script>
<script>
window.onOverlayState = function(state) {
  const el = (id) => document.getElementById(id);
  el('mb-local-logo').src = state.local.logo || '';
  el('mb-local-name').textContent = state.local.nombre || '';
  el('mb-local-score').textContent = state.local.goles ?? 0;
  el('mb-away-logo').src = state.visitante.logo || '';
  el('mb-away-name').textContent = state.visitante.nombre || '';
  el('mb-away-score').textContent = state.visitante.goles ?? 0;
  const s = state.match.status;
  el('mb-status').textContent = s === 'NO INICIADO' ? '' : 'EN VIVO • ' + s;
};
</script>

</body>
</html>
