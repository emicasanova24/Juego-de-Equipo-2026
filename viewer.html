<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Transmisión en vivo</title>
  <style>
    body { font-family: sans-serif; background: #111; color: white; padding: 10px; }
    .evento { margin-bottom: 10px; padding: 8px; border-bottom: 1px solid #333; }
    .evento.gol { color: #4CAF50; }
    .evento.amarilla { color: yellow; }
    .evento.roja { color: red; }
    .evento.cambio { color: #00BCD4; }
  </style>
</head>
<body>
  <h2>Minuto a Minuto</h2>
  <div id="eventos"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD0qGp051XQV84z460YlmJ5p4qCsScTfoM",
      authDomain: "juego-de-equipo.firebaseapp.com",
      projectId: "juego-de-equipo",
      databaseURL: "https://juego-de-equipo-default-rtdb.firebaseio.com",
      storageBucket: "juego-de-equipo.firebasestorage.app",
      messagingSenderId: "5358754385",
      appId: "1:5358754385:web:b3ae91d0eb1124dce4f670",
      measurementId: "G-K79EV7NDPP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const contenedor = document.getElementById('eventos');

    db.ref('eventos').orderByChild('timestamp').on('value', (snapshot) => {
      const datos = snapshot.val();
      contenedor.innerHTML = '';
      for (let id in datos) {
        const e = datos[id];
        const div = document.createElement('div');
        div.className = `evento ${e.evento}`;
        div.innerText = `${e.minuto}' - ${e.jugador} - ${e.evento}`;
        contenedor.appendChild(div);
      }
    });
  </script>
</body>
</html>
