<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Banner</title>
<link rel="stylesheet" href="/pro/assets/css/overlays.css">
<style>
  .wrap{position:absolute;bottom:0px;left:0;right:0;transform:translateY(100%);transition:transform .55s cubic-bezier(.22,1,.36,1);pointer-events:none;display:flex;justify-content:center;align-items:flex-end}
  .wrap.show{transform:translateY(0)}
  #img{max-width:1920px;max-height:1080px;object-fit:contain;display:block}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <img id="img" src="" alt="">
</div>
<script src="/pro/assets/js/overlay-client.js"></script>
<script>
const wrap=document.getElementById('wrap');
const img=document.getElementById('img');
window.onOverlayState=function(s){
  const show=!s.emergencyMode&&s.widgets?.publicidad&&s.ads?.active&&(s.ads?.current==='banner'||s.ads?.current==='overlay');
  wrap.classList.toggle('show',!!show);
  const url=s.ads?.logoBanner||s.ads?.logoSponsor||'';
  if(url&&img.src!==url) img.src=url;
};
</script>
</body>
</html>
