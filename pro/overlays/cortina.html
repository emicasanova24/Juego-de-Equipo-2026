<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cortina de Sponsor</title>
<link rel="stylesheet" href="/pro/assets/css/overlays.css">
<style>
  html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;}
  .cortina{
    position:absolute;inset:0;
    background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:52px 100px 52px;
    opacity:0;pointer-events:none;transition:opacity .6s ease;
  }
  .cortina.show{opacity:1;}
  .particles{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .p{position:absolute;background:rgba(139,92,246,.55);border-radius:50%;animation:float linear infinite;}
  @keyframes float{from{transform:translateY(110vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:.4}to{transform:translateY(-10vh) scale(1.5);opacity:0}}
  .top-row{display:flex;align-items:center;justify-content:space-between;width:100%;}
  .jde-logo{height:80px;object-fit:contain;}
  .momento-pill{
    font-size:16px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;
    color:#c4b5fd;background:rgba(124,58,237,.25);border:2px solid #8B5CF6;
    padding:8px 28px;border-radius:4px;
  }
  .center{flex:1;display:flex;align-items:center;justify-content:center;}
  .momento-text{
    font-size:220px;font-weight:900;line-height:1;
    text-transform:uppercase;letter-spacing:.02em;
    color:#ffffff;text-shadow:0 0 60px rgba(139,92,246,.7);
  }
  .momento-text.entretiempo{font-size:150px;}
  .momento-text.final{font-size:137px;}
  .sponsors-section{width:100%;}
  .divider{width:100%;height:2px;background:linear-gradient(90deg,transparent,#8B5CF6,transparent);margin-bottom:28px;}
  .sponsors-label{text-align:center;font-size:13px;font-weight:800;letter-spacing:.28em;color:#a78bfa;text-transform:uppercase;margin-bottom:20px;}
  .sponsors-grid{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 32px;}
  .simg{height:64px;max-width:140px;object-fit:contain;}
</style>
</head>
<body>
<div class="cortina" id="cortina">
  <div class="particles" id="particles"></div>
  <div class="top-row" style="position:relative;z-index:1">
    <img class="jde-logo" src="/pro/assets/img/logo.png?v=20260823" alt="Juego de Equipo" onerror="this.style.display='none'">
    <div id="momentoPill" class="momento-pill">ENTRETIEMPO</div>
  </div>
  <div class="center" style="position:relative;z-index:1">
    <div id="momentoText" class="momento-text entretiempo">ENTRETIEMPO</div>
  </div>
  <div class="sponsors-section" style="position:relative;z-index:1">
    <div class="divider"></div>
    <div class="sponsors-label">Nuestros Sponsors</div>
    <div class="sponsors-grid" id="sponsorsGrid"></div>
  </div>
</div>
<script src="/pro/assets/js/overlay-client.js"></script>
<script>
const pc = document.getElementById('particles');
for (let i = 0; i < 30; i++) {
  const p = document.createElement('div');
  p.className = 'p';
  p.style.cssText = `left:${Math.random()*100}%;animation-duration:${4+Math.random()*8}s;animation-delay:${Math.random()*8}s;width:${3+Math.random()*8}px;height:${3+Math.random()*8}px`;
  pc.appendChild(p);
}
const grid = document.getElementById('sponsorsGrid');
for (let i = 1; i <= 19; i++) {
  const img = document.createElement('img');
  img.className = 'simg';
  img.src = '/sponsors/' + i + '.png';
  img.alt = 'Sponsor ' + i;
  img.onerror = function() { this.style.display = 'none'; };
  grid.appendChild(img);
}
const PILL_LABELS = { inicio: 'INICIO', entretiempo: 'ENTRETIEMPO', final: 'FINAL' };
const TEXT_LABELS  = { inicio: 'Ya comenzamos', entretiempo: 'Entretiempo', final: 'Llegamos al final' };
window.onOverlayState = function(s) {
  const show = !s.emergencyMode && !!s.widgets?.cortina;
  document.getElementById('cortina').classList.toggle('show', !!show);
  if (!show) return;
  const mode = s.cortina?.mode || 'entretiempo';
  document.getElementById('momentoPill').textContent = PILL_LABELS[mode] || mode.toUpperCase();
  const el = document.getElementById('momentoText');
  el.textContent = TEXT_LABELS[mode] || mode;
  const cls = mode === 'final' ? ' final' : (mode === 'entretiempo' ? ' entretiempo' : '');
  el.className = 'momento-text' + cls;
};
</script>
</body>
</html>
