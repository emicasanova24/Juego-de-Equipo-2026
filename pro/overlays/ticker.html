<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ticker en Vivo</title>
<link rel="stylesheet" href="/pro/assets/css/overlays.css">
<style>
  .wrap{position:absolute;bottom:0;left:0;right:0;height:48px;transform:translateY(100%);opacity:0;transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .45s ease;overflow:hidden;pointer-events:none}
  .wrap.show{transform:translateY(0);opacity:1}
  .bar{position:absolute;inset:0;display:flex;align-items:center;background:rgba(8,6,20,0.88);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,0.08)}

  /* Label LIVE SCORES */
  .lbl-wrap{position:relative;z-index:2;height:100%;display:flex;align-items:center;flex-shrink:0}
  .lbl{background:#8c52ff;color:#fff;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:0.22em;padding:0 24px 0 20px;height:100%;display:flex;align-items:center;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 100%,0 100%)}

  /* Divisor */
  .sep{width:1px;height:24px;background:rgba(140,82,255,0.4);flex-shrink:0;margin:0 4px}

  /* Scroll */
  .scroll{flex:1;overflow:hidden;position:relative;height:100%;mask-image:linear-gradient(to right,transparent,black 20px,black calc(100% - 20px),transparent)}
  .track{display:flex;align-items:center;height:100%;animation:scroll linear infinite;white-space:nowrap;gap:0}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  .match-item{display:inline-flex;align-items:center;gap:10px;padding:0 32px;height:100%;color:#d0d0e0;cursor:default}
  .match-item:hover{background:rgba(255,255,255,0.04)}
  .t-name{font-size:13px;font-weight:700;text-transform:uppercase;color:#e8e8f0;letter-spacing:0.04em}
  .t-score{font-size:15px;font-weight:900;color:#8c52ff;letter-spacing:0.05em;padding:2px 10px;background:rgba(140,82,255,0.12);border-radius:4px}
  .t-time{font-size:11px;font-weight:700;color:#6b6b80;letter-spacing:0.05em}
  .t-time.ft{color:#8c52ff}
  .bullet{width:3px;height:3px;border-radius:50%;background:rgba(140,82,255,0.4);flex-shrink:0}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="bar">
    <div class="lbl-wrap">
      <div class="lbl">🔴 LIVE SCORES</div>
    </div>
    <div class="sep"></div>
    <div class="scroll"><div class="track" id="track"></div></div>
  </div>
</div>
<script src="/pro/assets/js/overlay-client.js"></script>
<script>
const wrap=document.getElementById('wrap'),track=document.getElementById('track');
let cur=[];

function buildItem(text) {
  // Detectar si el item tiene formato "EQUIPO1 X-X EQUIPO2 tiempo"
  // Ej: "Alianza 1-0 Equipo B 88'" o texto libre
  const matchPattern = /^(.+?)\s+(\d+[-–]\d+)\s+(.+?)(?:\s+(\d+['+]?|FT|ET))?$/i;
  const m = text.match(matchPattern);
  if (m) {
    const ft = /^(FT|ET|FIN)$/i.test(m[4]||'');
    return `<span class="match-item">
      <span class="t-name">${m[1]}</span>
      <span class="t-score">${m[2]}</span>
      <span class="t-name">${m[3]}</span>
      ${m[4] ? `<span class="t-time${ft?' ft':''}">${m[4]}</span>` : ''}
    </span><span class="bullet"></span>`;
  }
  return `<span class="match-item"><span class="t-name">${text}</span></span><span class="bullet"></span>`;
}

window.onOverlayState=function(s){
  wrap.classList.toggle('show',!s.emergencyMode&&!!s.widgets?.ticker);
  if(s.ticker){
    const items=s.ticker.items||[];
    if(JSON.stringify(items)!==JSON.stringify(cur)){
      cur=items;
      if(!items.length){track.innerHTML='';return}
      const doubled=[...items,...items];
      track.innerHTML=doubled.map(buildItem).join('');
      track.style.animationDuration=Math.max(10,track.scrollWidth/2/90)+'s';
    }
  }
};
</script>
</body>
</html>
