<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Estadísticas en Vivo</title>
<link rel="stylesheet" href="/pro/assets/css/overlays.css">
<style>
  .panel{position:absolute;top:50%;right:60px;transform:translateY(-50%) translateX(130%);width:420px;background:rgba(12,12,24,.97);border:2px solid rgba(139,92,246,.5);border-radius:4px;padding:22px;color:#fff;transition:transform .55s cubic-bezier(.22,1,.36,1),opacity .4s ease;opacity:0;box-shadow:0 8px 40px rgba(0,0,0,.7)}
  .panel.show{transform:translateY(-50%) translateX(0);opacity:1}
  .head{display:flex;align-items:center;justify-content:center;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid rgba(139,92,246,.3)}
  .title{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:3px;color:#8B5CF6}
  .teams{display:flex;justify-content:space-between;margin-bottom:12px}
  .tname{font-size:11px;font-weight:700;color:#e0e0e0;text-transform:uppercase;letter-spacing:1px}
  .sline{margin-bottom:8px}
  .slbl{display:flex;justify-content:space-between;font-size:11px;color:#9ca3af;margin-bottom:3px;text-transform:uppercase;letter-spacing:.4px}
  .slbl span{font-weight:700;color:#e5e7eb}
  .track{height:6px;background:rgba(255,255,255,.08);overflow:hidden;display:flex}
  .bl{height:100%;background:#8B5CF6;transition:width .6s ease}
  .bv{height:100%;background:#06b6d4;margin-left:auto;transition:width .6s ease}
  .dest{margin-top:14px;padding-top:10px;border-top:1px solid rgba(139,92,246,.3);display:flex;align-items:center;gap:10px}
  .dsil{width:50px;height:50px;background:rgba(139,92,246,.2);border:2px solid #8B5CF6;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .di{flex:1}.dlbl{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:2px;color:#8B5CF6;margin-bottom:2px}
  .dname{font-size:16px;font-weight:900;color:#fff;line-height:1.1}
  .dstat{font-size:11px;font-weight:700;color:#a78bfa;margin-top:2px}
  .dnum{font-size:24px;font-weight:900;color:#8B5CF6}
</style>
</head>
<body>
<div class="panel" id="panel">
  <div class="head"><div class="title">📊 Estadísticas</div></div>
  <div class="teams">
    <span class="tname" id="tl">Local</span>
    <span class="tname" id="tv">Visitante</span>
  </div>
  <div id="stats"></div>
  <div class="dest" id="dest" style="display:none">
    <div class="dsil">⭐</div>
    <div class="di">
      <div class="dlbl">Jugador Destacado</div>
      <div class="dname" id="dname">—</div>
      <div class="dstat" id="dstat"></div>
    </div>
    <div class="dnum" id="dnum"></div>
  </div>
</div>
<script src="/pro/assets/js/overlay-client.js"></script>
<script>
const SKEYS=[{k:'posesion',l:'POSESIÓN',pct:true},{k:'tiros',l:'TIROS'},{k:'tirosPuerta',l:'AL ARCO'},{k:'corners',l:'CORNERS'},{k:'faltas',l:'FALTAS'}];
function bw(a,b){const t=a+b;if(!t)return{l:50,v:50};return{l:Math.round(a/t*100),v:Math.round(b/t*100)}}
let _sigStats=null;
window.onOverlayState=function(s){
  const show=!s.emergencyMode&&s.widgets?.estadisticas;
  document.getElementById('panel').classList.toggle('show',!!show);
  if(!show||!s.stats)return;
  // Solo redibuja si cambian las estadísticas o los nombres de equipos.
  const sig=JSON.stringify({st:s.stats,ln:s.local?.nombre,vn:s.visitante?.nombre});
  if(sig===_sigStats)return;
  _sigStats=sig;
  document.getElementById('tl').textContent=s.local?.nombre||'Local';
  document.getElementById('tv').textContent=s.visitante?.nombre||'Visitante';
  const l=s.stats.local,v=s.stats.visitante;
  document.getElementById('stats').innerHTML=SKEYS.map(k=>{
    const lv=l[k.k]??0,vv=v[k.k]??0;
    const w=k.pct?{l:lv,v:100-lv}:bw(lv,vv);
    return`<div class="sline"><div class="slbl"><span>${k.pct?lv+'%':lv}</span><span>${k.l}</span><span>${k.pct?(100-lv)+'%':vv}</span></div>
    <div class="track"><div class="bl" style="width:${w.l}%"></div><div class="bv" style="width:${w.v}%"></div></div></div>`;
  }).join('');
  const d=s.stats.jugadorDestacado;
  const dd=document.getElementById('dest');
  if(d?.nombre){dd.style.display='flex';document.getElementById('dname').textContent=d.nombre;document.getElementById('dstat').textContent=d.stat||'';document.getElementById('dnum').textContent=d.numero?'#'+d.numero:''}
  else dd.style.display='none';
};
</script>
</body>
</html>
